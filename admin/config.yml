backend:
  name: github
  repo: nicolasemelo/hablemos-de-automovilismo
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "news"
    label: "Noticias"
    files:
      - file: "content/news.json"
        label: "Todas las noticias"
        name: "news"
        fields:
          - label: "Artículos"
            name: "articles"
            widget: "list"
            summary: "{{fields.categoryLabel}} — {{fields.title}}"
            fields:
              - label: "Imagen"
                name: "image"
                widget: "image"
                required: false
                hint: "Foto de la noticia. Se recorta automáticamente en formato horizontal."
              - label: "Categoría"
                name: "category"
                widget: "select"
                options:
                  - { label: "Fórmula 1", value: "formula1" }
                  - { label: "MotoGP", value: "motogp" }
                  - { label: "Rally & Resistencia", value: "rally" }
              - label: "Etiqueta de categoría (para mostrar)"
                name: "categoryLabel"
                widget: "select"
                options:
                  - "F1"
                  - "MotoGP"
                  - "Rally"
              - label: "Etiqueta de la nota (ej. Mercado de pases, Técnica)"
                name: "tag"
                widget: "string"
              - label: "Título"
                name: "title"
                widget: "string"
              - label: "Resumen / bajada (se muestra en la tarjeta)"
                name: "excerpt"
                widget: "text"
              - label: "Texto completo de la nota (se muestra al abrir la nota)"
                name: "body"
                widget: "text"
                required: false
                hint: "Si lo dejás vacío, se muestra el resumen de arriba como texto completo."
              - label: "Fecha (texto libre, ej. 'Hace 2 h' o '03 AGO 2026')"
                name: "date"
                widget: "string"
              - label: "Vistas (número, opcional)"
                name: "views"
                widget: "number"
                default: 0
                required: false

  - name: "standings"
    label: "Fórmula 1 — Posiciones"
    files:
      - file: "content/standings.json"
        label: "Pilotos, Escuderías, Calendario y Resultados"
        name: "standings"
        fields:
          - label: "Texto de 'Actualizado' (aparece arriba de cada tabla)"
            name: "updated"
            widget: "string"
          - label: "Pilotos"
            name: "drivers"
            widget: "list"
            summary: "{{fields.pos}}. {{fields.name}} — {{fields.points}} pts"
            fields:
              - { label: "Posición", name: "pos", widget: "number" }
              - { label: "Nombre del piloto", name: "name", widget: "string" }
              - { label: "Escudería", name: "team", widget: "string" }
              - { label: "Puntos", name: "points", widget: "number" }
              - { label: "Foto del piloto", name: "photo", widget: "image", required: false }
          - label: "Escuderías"
            name: "teams"
            widget: "list"
            summary: "{{fields.name}} — {{fields.points}} pts"
            fields:
              - { label: "Nombre de la escudería", name: "name", widget: "string" }
              - { label: "Puntos", name: "points", widget: "number" }
              - { label: "Logo de la escudería", name: "logo", widget: "image", required: false }
          - label: "Calendario"
            name: "calendar"
            widget: "list"
            summary: "Ronda {{fields.round}} — {{fields.name}}"
            fields:
              - { label: "Número de ronda", name: "round", widget: "number" }
              - { label: "Nombre del Gran Premio", name: "name", widget: "string" }
              - { label: "¿Ya se corrió?", name: "done", widget: "boolean", default: false }
          - label: "Último resultado (Resultados)"
            name: "lastRace"
            widget: "object"
            fields:
              - { label: "Nombre del Gran Premio", name: "name", widget: "string" }
              - label: "Podio"
                name: "podium"
                widget: "list"
                summary: "{{fields.pos}} — {{fields.name}}"
                fields:
                  - { label: "Posición (ej. P1)", name: "pos", widget: "string" }
                  - { label: "Piloto", name: "name", widget: "string" }
                  - { label: "Escudería", name: "team", widget: "string", required: false }
                  - { label: "Foto del piloto", name: "photo", widget: "image", required: false }
              - { label: "Nota / comentario debajo del podio", name: "note", widget: "text", required: false }
