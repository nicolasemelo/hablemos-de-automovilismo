backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "news"
    label: "Noticias"
    files:
      - file: "content/news.json"
        label: "Todas las noticias"
        name: "news"
        fields:
          - label: "Artículos"
            name: "articles"
            widget: "list"
            summary: "{{fields.categoryLabel}} — {{fields.title}}"
            fields:
              - label: "Imagen"
                name: "image"
                widget: "image"
                required: false
                hint: "Foto de la noticia. Se recorta automáticamente en formato horizontal."
              - label: "Categoría"
                name: "category"
                widget: "select"
                options:
                  - { label: "Fórmula 1", value: "formula1" }
                  - { label: "MotoGP", value: "motogp" }
                  - { label: "Rally & Resistencia", value: "rally" }
              - label: "Etiqueta de categoría (para mostrar)"
                name: "categoryLabel"
                widget: "select"
                options:
                  - "F1"
                  - "MotoGP"
                  - "Rally"
              - label: "Etiqueta de la nota (ej. Mercado de pases, Técnica)"
                name: "tag"
                widget: "string"
              - label: "Título"
                name: "title"
                widget: "string"
              - label: "Resumen / bajada"
                name: "excerpt"
                widget: "text"
              - label: "Fecha (texto libre, ej. 'Hace 2 h' o '03 AGO 2026')"
                name: "date"
                widget: "string"
              - label: "Vistas (número, opcional)"
                name: "views"
                widget: "number"
                default: 0
                required: false
